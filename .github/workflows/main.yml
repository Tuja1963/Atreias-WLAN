name: Atreias-WLAN

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Runa untersucht den echten Nachrichtenabruf
        run: |
          echo "📡 Kuratorin Runa ist auf Empfang."
          echo "🔎 Ich suche jetzt gezielt nach dem Nachrichten-API."

          URL="https://assets.playnccdn.com/uikit/uikit-nccommunity/2.3.8/js/createBoard.js"

          curl -L --fail --silent --show-error \
            "$URL" \
            -o createBoard.js

          echo "✅ createBoard.js geladen."
          echo ""

          echo "🔎 Stellen mit api-search.plaync.com:"
          grep -oiFn "api-search.plaync.com" createBoard.js || true

          echo ""
          echo "🔎 Stellen mit articleId:"
          grep -in "articleId" createBoard.js | head -n 20 || true

          echo ""
          echo "🔎 Ausschnitte rund um api-search.plaync.com:"
          while read -r line; do
            start=$((line - 8))
            [ "$start" -lt 1 ] && start=1
            end=$((line + 8))

            echo ""
            echo "----- Zeilen $start bis $end -----"
            sed -n "${start},${end}p" createBoard.js
          done < <(grep -in "api-search.plaync.com" createBoard.js | cut -d: -f1)

          echo ""
          echo "✅ Runa hat den technischen Nachrichtenweg untersucht."
