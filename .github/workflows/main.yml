name: Atreias-WLAN

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

jobs:
  runa:
    runs-on: ubuntu-latest

    steps:
      - name: Offizielle AION 2 Quelle abrufen
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://api-search.plaync.com/aion2/notice" \
            -o aion2.json

          echo "Antwortgröße:"
          wc -c aion2.json

      - name: Antwort auswerten
        run: |
          python3 - <<'PY'
          import json
          import re
          from html import unescape

          with open("aion2.json", "r", encoding="utf-8") as f:
              raw = f.read()

          print("Erste 2000 Zeichen der Antwort:")
          print(raw[:2000])

          try:
              data = json.loads(raw)
          except Exception:
              data = None

          def clean(value):
              value = unescape(str(value))
              value = re.sub(r"<[^>]+>", " ", value)
              value = re.sub(r"\s+", " ", value)
              return value.strip()

          title = None
          article_id = None

          def walk(obj):
              global title, article_id

              if isinstance(obj, dict):
                  for key, value in obj.items():
                      k = key.lower()

                      if title is None and k in ("title", "subject", "article_title"):
                          text = clean(value)
                          if text:
                              title = text

                      if article_id is None and k in ("articleid", "article_id"):
                          text = clean(value)
                          if text:
                              article_id = text

                      walk(value)

              elif isinstance(obj, list):
                  for item in obj:
                      walk(item)

          if data is not None:
              walk(data)

          if article_id:
              link = (
                  "https://aion2.plaync.com/en-us/board/notice/view"
                  f"?articleId={article_id}"
              )

              message = (
                  "📡 **Ätherstrom – AION 2**\n\n"
                  f"**{title or 'Offizielle AION-2-Meldung'}**\n\n"
                  f"🆔 Artikel-ID: `{article_id}`\n"
                  f"🔗 {link}"
              )
          else:
              message = (
                  "📡 **Ätherstrom – AION 2**\n\n"
                  "Die Quelle antwortet, aber die erwarteten "
                  "AION-2-Artikeldaten wurden nicht gefunden."
              )

          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(
                  {"content": message[:1800]},
                  f,
                  ensure_ascii=False
              )

          print(message)
          PY

      - name: Nachricht an Discord senden
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
