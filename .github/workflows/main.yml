name: Atreias-WLAN – NC Antenne

on:
  workflow_dispatch:

jobs:
  nc-news:
    runs-on: ubuntu-latest

    steps:
      - name: Offiziellen NC-AION-2-Artikel abrufen
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://www.nc.com/newsroom/news/articles/?articleId=695dbbc84984ee2095a3cd1c&boardLanguage=en" \
            -o article.html

      - name: NC-Meldung vorbereiten
        run: |
          python3 - <<'PY'
          import json
          import re
          from html import unescape

          with open(
              "article.html",
              "r",
              encoding="utf-8",
              errors="ignore"
          ) as f:
              page = f.read()

          match = re.search(
              r"<title[^>]*>(.*?)</title>",
              page,
              re.I | re.S
          )

          if not match:
              print("Kein NC-Titel gefunden.")
              raise SystemExit(1)

          title = re.sub(
              r"<[^>]+>",
              " ",
              match.group(1)
          )

          title = unescape(title)
          title = re.sub(r"\s+", " ", title).strip()

          link = (
              "https://www.nc.com/newsroom/news/articles/"
              "?articleId=695dbbc84984ee2095a3cd1c"
              "&boardLanguage=en"
          )

          message = (
              "📡 **Ätherstrom – AION 2**\n\n"
              f"📰 **{title}**\n\n"
              f"🔗 {link}"
          )

          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(
                  {"content": message},
                  f,
                  ensure_ascii=False
              )

          print(message)
          PY

      - name: NC-Meldung an Discord senden
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
