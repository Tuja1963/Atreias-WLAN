name: Atreias-WLAN

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Runa untersucht den Nachrichtenweg
        run: |
          echo "📡 Kuratorin Runa ist auf Empfang."
          echo "🔎 Ich untersuche jetzt, woher die offiziellen Meldungen kommen."

          curl -L --fail --silent --show-error \
            "https://aion2.plaync.com/en-us/board/notice/list?redirect=false" \
            -o announcements.html

          echo "✅ Offizielle Seite erreicht."

          echo ""
          echo "📄 Eingebundene JavaScript-Dateien:"

          grep -oiE '<script[^>]+src="[^"]+"' announcements.html \
            | sed -E 's/.*src="([^"]+)".*/\1/' \
            | sort -u > scripts.txt

          cat scripts.txt

          mkdir -p runa-data/js

          echo ""
          echo "🔎 Untersuche JavaScript-Dateien nach möglichen Nachrichten-Schnittstellen..."

          while IFS= read -r src; do
            [ -z "$src" ] && continue

            case "$src" in
              http*)
                url="$src"
                ;;
              /*)
                url="https://aion2.plaync.com$src"
                ;;
              *)
                url="https://aion2.plaync.com/$src"
                ;;
            esac

            filename=$(printf '%s' "$src" | md5sum | cut -d' ' -f1)

            echo ""
            echo "➡️ $url"

            curl -L --fail --silent --show-error \
              "$url" \
              -o "runa-data/js/$filename.js" || {
                echo "⚠️ Datei konnte nicht geladen werden."
                continue
              }

            grep -oiE \
              'https?://[^"'\'' ]+|/api/[A-Za-z0-9_./?=&${}-]+|graphql|articleId|board/notice' \
              "runa-data/js/$filename.js" \
              | head -n 50 \
              || true

          done < scripts.txt

          echo ""
          echo "✅ Untersuchung abgeschlossen."
