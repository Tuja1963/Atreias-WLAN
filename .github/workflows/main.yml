name: Atreias-WLAN

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

jobs:
  runa:
    runs-on: ubuntu-latest

    steps:
      - name: AION 2 Seite abrufen
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://aion2.plaync.com/en-us/board/notice/list" \
            -o aion2.html

      - name: Nachricht vorbereiten
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          import re
          import json

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []

              def handle_data(self, data):
                  text = re.sub(r"\s+", " ", data).strip()
                  if text:
                      self.parts.append(text)

          parser = TextParser()

          with open("aion2.html", "r", encoding="utf-8") as f:
              parser.feed(f.read())

          lines = []
          for text in parser.parts:
              if text not in lines:
                  lines.append(text)

          message = "\n".join(lines[:20])

          if not message:
              message = "Atreias-WLAN hat die AION-2-Seite erreicht, aber noch keinen Nachrichtentext gefunden."

          message = message[:1800]

          payload = {
              "content": "📡 **AION 2 – Atreias-WLAN**\n\n" + message
          }

          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

      - name: Nachricht an Discord senden
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
