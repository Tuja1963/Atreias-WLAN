name: Atreias-WLAN – NC API finden

on:
  workflow_dispatch:

jobs:
  nc-api:
    runs-on: ubuntu-latest

    steps:
      - name: AION-2-Seite laden
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://aion2.plaync.com/en-us/board/notice/list?redirect=false" \
            -o nc.html

      - name: Echte API-Adresse finden
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from urllib.parse import urljoin

          with open("nc.html", "r", encoding="utf-8", errors="ignore") as f:
              page = f.read()

          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              page,
              re.I
          )

          scripts = list(dict.fromkeys(scripts))

          print(f"JS-Dateien: {len(scripts)}")

          api_urls = set()

          for src in scripts:
              url = urljoin(
                  "https://aion2.plaync.com/en-us/board/notice/",
                  src
              )

              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(req, timeout=20) as r:
                      js = r.read().decode("utf-8", errors="ignore")

                  # Alle URLs mit API-Bezug herausziehen
                  matches = re.findall(
                      r'https?://[^"\'\s<>]+',
                      js
                  )

                  for match in matches:
                      clean = match.rstrip("\\),;")
                      low = clean.lower()

                      if (
                          "api" in low
                          or "article" in low
                          or "board" in low
                      ):
                          api_urls.add(clean)

              except Exception:
                  pass

          print()
          print("========== GEFUNDENE KANDIDATEN ==========")

          for url in sorted(api_urls):
              print(url)

          print("==========================================")

          if not api_urls:
              print("KEIN API-ENDPUNKT GEFUNDEN")
              raise SystemExit(1)
          PY
