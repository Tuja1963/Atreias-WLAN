name: Atreias-WLAN

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  atreias-wlan:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: AION-2-Steam-News abrufen
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://store.steampowered.com/feeds/news/app/3393110/?l=german&cc=DE" \
            -o aion2.xml

          echo "Antwortgröße:"
          wc -c aion2.xml

      - name: Neue Meldungen ermitteln
        run: |
          python3 - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET

          STATE = "aion2_seen.json"
          OUTPUT = "new_items.json"

          if os.path.exists(STATE):
              with open(STATE, "r", encoding="utf-8") as f:
                  seen = set(json.load(f))
          else:
              seen = set()

          root = ET.parse("aion2.xml").getroot()

          new_items = []

          for item in root.findall(".//item"):
              title = (item.findtext("title") or "").strip()
              link = (item.findtext("link") or "").strip()
              guid = (item.findtext("guid") or "").strip()

              if not guid:
                  guid = link

              if not title or not link or not guid:
                  continue

              if guid in seen:
                  continue

              new_items.append({
                  "title": title,
                  "link": link,
                  "guid": guid
              })

          # Älteste zuerst, damit nichts übersprungen wird
          new_items.reverse()

          with open(OUTPUT, "w", encoding="utf-8") as f:
              json.dump(new_items, f, ensure_ascii=False, indent=2)

          print(f"Neue Meldungen: {len(new_items)}")
          PY

      - name: Neue Meldungen an Discord senden
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          with open("new_items.json", "r", encoding="utf-8") as f:
              items = json.load(f)

          if not items:
              print("Keine neuen Meldungen.")
              sys.exit(0)

          webhook = os.environ["DISCORD_WEBHOOK_URL"]

          sent = []

          for item in items:
              message = (
                  "📡 **Ätherstrom – AION 2**\n\n"
                  f"📰 **{item['title']}**\n\n"
                  f"🔗 {item['link']}"
              )

              payload = json.dumps(
                  {"content": message},
                  ensure_ascii=False
              ).encode("utf-8")

              request = urllib.request.Request(
                  webhook,
                  data=payload,
                  headers={
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status not in (200, 204):
                          raise RuntimeError(
                              f"Discord antwortete mit HTTP {response.status}"
                          )

                  sent.append(item["guid"])
                  print(f"Gesendet: {item['title']}")

              except Exception as e:
                  print(f"Fehler beim Senden: {e}")
                  print("Noch nicht gesendete Meldungen bleiben erhalten.")
                  sys.exit(1)

          with open("sent_items.json", "w", encoding="utf-8") as f:
              json.dump(sent, f, ensure_ascii=False, indent=2)
          PY

      - name: Erfolgreich gesendete Meldungen speichern
        run: |
          python3 - <<'PY'
          import json
          import os

          STATE = "aion2_seen.json"

          if os.path.exists(STATE):
              with open(STATE, "r", encoding="utf-8") as f:
                  seen = set(json.load(f))
          else:
              seen = set()

          with open("sent_items.json", "r", encoding="utf-8") as f:
              sent = json.load(f)

          seen.update(sent)

          with open(STATE, "w", encoding="utf-8") as f:
              json.dump(sorted(seen), f, ensure_ascii=False, indent=2)

          print(f"Gespeicherte Meldungen: {len(seen)}")
          PY

      - name: Nachrichtenstand speichern
        run: |
          git config user.name "Atreias-WLAN"
          git config user.email "atreias-wlan@users.noreply.github.com"

          git add aion2_seen.json

          if ! git diff --cached --quiet; then
            git commit -m "AION 2 Nachrichtenstand aktualisieren"
            git push
          else
            echo "Kein neuer Nachrichtenstand."
          fi
