name: Atreias-WLAN

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

jobs:
  runa:
    runs-on: ubuntu-latest

    steps:
      - name: Offizielle AION 2 Meldungen abrufen
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://aion2.plaync.com/en-us/board/notice/list?redirect=false" \
            -o aion2.html

          echo "Antwortgröße:"
          wc -c aion2.html

      - name: Neue Meldung erkennen
        run: |
          python3 - <<'PY'
          import re
          import json
          from html import unescape

          with open("aion2.html", "r", encoding="utf-8") as f:
              raw = f.read()

          # Artikel-IDs aus der offiziellen Seite suchen
          ids = re.findall(r'articleId[=:]["\']?([0-9a-fA-F]{24})', raw)

          # Doppelte IDs entfernen, Reihenfolge behalten
          ids = list(dict.fromkeys(ids))

          if ids:
              article_id = ids[0]

              link = (
                  "https://aion2.plaync.com/en-us/board/notice/view"
                  f"?articleId={article_id}"
              )

              message = (
                  "📡 **Ätherstrom – AION 2**\n\n"
                  "Eine offizielle AION-2-Meldung wurde erkannt.\n\n"
                  f"🔗 {link}"
              )
          else:
              message = (
                  "📡 **Ätherstrom – AION 2**\n\n"
                  "Die offizielle AION-2-Seite wurde erreicht, "
                  "aber aktuell keine Artikel-ID erkannt."
              )

          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(
                  {"content": message},
                  f,
                  ensure_ascii=False
              )

          print(message)
          PY

      - name: Nachricht an Discord senden
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
