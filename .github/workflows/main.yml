name: Atreias-WLAN – NC Test

on:
  workflow_dispatch:

jobs:
  nc-test:
    runs-on: ubuntu-latest

    steps:
      - name: Offizielle AION-2-News abrufen
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://aion2.plaync.com/en-us/board/notice/list?redirect=false" \
            -o nc.html

          echo "NC-Seite abgerufen."
          echo "Größe der Antwort:"
          wc -c nc.html

      - name: Ergebnis prüfen
        run: |
          if grep -qi "Announcements" nc.html; then
            echo "NC-Ankündigungsseite wurde erreicht."
          else
            echo "NC-Seite erreicht, aber Ankündigungsbereich nicht gefunden."
            exit 1
          fi
