nname: Atreias-WLAN

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  atreias-wlan:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Steam-AION-2-Nachrichten abrufen
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://store.steampowered.com/feeds/news/app/3393110/?l=german&cc=DE" \
            -o aion2.xml

          echo "Antwortgröße:"
          wc -c aion2.xml

      - name: Neue Meldung erkennen und Zeitung bauen
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from html import unescape

          FEED = "aion2.xml"
          STATE = "aion2_seen.json"
          PAYLOAD = "payload.json"

          # Bereits gemeldete Steam-News laden
          if os.path.exists(STATE):
              with open(STATE, "r", encoding="utf-8") as f:
                  seen = set(json.load(f))
          else:
              seen = set()

          # RSS lesen
          root = ET.parse(FEED).getroot()

          items = root.findall(".//item")

          # Neueste Meldungen zuerst
          new_items = []

          for item in items:
              title = item.findtext("title", "").strip()
              link = item.findtext("link", "").strip()
              guid = item.findtext("guid", "").strip()

              if not guid:
                  guid = link

              if not title or not link or not guid:
                  continue

              if guid in seen:
                  continue

              new_items.append({
                  "title": title,
                  "link": link,
                  "guid": guid
              })

          # Falls nichts Neues vorhanden ist, nichts an Discord senden
          if not new_items:
              print("Keine neue AION-2-Meldung.")
              with open(PAYLOAD, "w", encoding="utf-8") as f:
                  json.dump({"content": ""}, f, ensure_ascii=False)

              raise SystemExit(0)

          # Nur die neueste Meldung veröffentlichen
          item = new_items[0]

          message = (
              "📡 **Ätherstrom – AION 2**\n\n"
              f"📰 **{item['title']}**\n\n"
              f"🔗 {item['link']}"
          )

          with open(PAYLOAD, "w", encoding="utf-8") as f:
              json.dump(
                  {"content": message},
                  f,
                  ensure_ascii=False
              )

          # Alle jetzt gefundenen Meldungen als gesehen markieren
          # Dadurch wird beim nächsten Lauf nichts doppelt gemeldet.
          for entry in new_items:
              seen.add(entry["guid"])

          with open(STATE, "w", encoding="utf-8") as f:
              json.dump(sorted(seen), f, ensure_ascii=False, indent=2)

          print(message)
          PY

      - name: Zeitung an Discord senden
        run: |
          if [ -s payload.json ]; then
            CONTENT=$(python3 - <<'PY'
          import json
          with open("payload.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          print(data.get("content", ""))
          PY
          )

            if [ -n "$CONTENT" ]; then
              curl -X POST \
                -H "Content-Type: application/json" \
                --data-binary @payload.json \
                "${{ secrets.DISCORD_WEBHOOK_URL }}"
            fi
          fi

      - name: Gemeldete Nachrichten speichern
        run: |
          if [ -f aion2_seen.json ]; then
            git config user.name "Atreias-WLAN"
            git config user.email "atreias-wlan@users.noreply.github.com"

            git add aion2_seen.json

            if ! git diff --cached --quiet; then
              git commit -m "AION 2 Nachrichtenstand aktualisieren"
              git push
            fi
          fi
