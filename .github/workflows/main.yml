
  
name: Atreias-WLAN

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

jobs:
  runa:
    runs-on: ubuntu-latest

    steps:
      - name: AION 2 Nachrichten abrufen
        run: |
          curl -L \
            -H "User-Agent: Mozilla/5.0" \
            "https://aion2.plaync.com/en-us/board/notice/list" \
            -o aion2.html

      - name: Nachricht an Discord senden
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          import re
          import json
          import os
          import urllib.request

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []

              def handle_data(self, data):
                  text = data.strip()
                  if text:
                      self.parts.append(text)

          parser = TextParser()

          with open("aion2.html", "r", encoding="utf-8") as f:
              parser.feed(f.read())

          lines = []
          for text in parser.parts:
              text = re.sub(r"\s+", " ", text).strip()
              if text and text not in lines:
                  lines.append(text)

          message = "\n".join(lines[:20])

          if not message:
              message = "📡 Atreias-WLAN hat die AION-2-Seite erreicht, konnte aber noch keinen Nachrichtentext auslesen."

          payload = json.dumps({
              "content": "📡 **Neue AION-2-Informationen**\n\n" + message
          }).encode("utf-8")

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print("Discord:", response.status)
          PY
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
