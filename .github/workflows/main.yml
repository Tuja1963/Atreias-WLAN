name: Atreias-WLAN – NC Datenquelle finden

on:
  workflow_dispatch:

jobs:
  nc-source:
    runs-on: ubuntu-latest

    steps:
      - name: Offizielle AION-2-Seite laden
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://aion2.plaync.com/en-us/board/notice/list?redirect=false" \
            -o nc.html

          echo "NC-Seite geladen."
          wc -c nc.html

      - name: JavaScript-Dateien der Seite finden
        run: |
          python3 - <<'PY'
          import re
          from urllib.parse import urljoin

          with open("nc.html", "r", encoding="utf-8", errors="ignore") as f:
              html = f.read()

          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              html,
              re.I
          )

          scripts = list(dict.fromkeys(scripts))

          print(f"Gefundene JavaScript-Dateien: {len(scripts)}")

          for src in scripts:
              print(urljoin(
                  "https://aion2.plaync.com/en-us/board/notice/",
                  src
              ))
          PY
