name: Atreias-WLAN

on:
  workflow_dispatch:

jobs:
  runa:
    runs-on: ubuntu-latest

    steps:
      - name: AION 2 Quelle untersuchen
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://aion2.plaync.com/en-us/board/notice/list" \
            -o aion2.html

          echo "===== GEFUNDENE API-HINWEISE ====="
          grep -oE 'https?[^" ]+api[^" ]+' aion2.html | head -20 || true

          echo "===== GEFUNDENE ARTICLE IDS ====="
          grep -oE 'articleId[^,}" ]*[:=][^,}" ]*' aion2.html | head -20 || true

          echo "===== DATEIGRÖSSE ====="
          wc -c aion2.html
