name: Atreias-WLAN

on:
  workflow_dispatch:
    inputs:
      test_message:
        description: "Testnachricht für den Ätherstrom"
        required: false
        default: ""
        type: string

  # 3× täglich: 08:00, 14:00 und 20:00 deutsche Sommerzeit
  # GitHub Actions verwendet UTC → 06:00, 12:00 und 18:00 UTC
  schedule:
    - cron: "0 6,12,18 * * *"

permissions:
  contents: write

jobs:
  atreias-wlan:
    runs-on: ubuntu-latest

    steps:

      - name: Repository laden
        uses: actions/checkout@v4

      - name: Steam AION 2 Nachrichten abrufen
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://store.steampowered.com/feeds/news/app/3393110/?l=german&cc=DE" \
            -o aion2.xml

      - name: Offizielle deutsche AION 2 Seite abrufen
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://aion2.plaync.com/de-de/board/notice/list?redirect=false" \
            -o nc-de.html

      - name: Offizielle englische AION 2 Seite abrufen
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://aion2.plaync.com/en-us/board/notice/list?redirect=false" \
            -o nc-en.html

      - name: NC Newsroom abrufen
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://www.nc.com/newsroom/news/?boardLanguage=en" \
            -o newsroom.html

      - name: Neue Meldungen vorbereiten
        env:
          TEST_MESSAGE: ${{ inputs.test_message }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import xml.etree.ElementTree as ET

          STATE = "aion2_seen.json"
          PAYLOAD = "payload.json"

          test_message = os.environ.get("TEST_MESSAGE", "").strip()

          # ------------------------------------------------------------
          # TESTNACHRICHT
          # ------------------------------------------------------------

          if test_message:
              message = (
                  "📡 **Ätherstrom – TEST**\n\n"
                  f"{test_message}"
              )

              with open(PAYLOAD, "w", encoding="utf-8") as f:
                  json.dump(
                      {"content": message},
                      f,
                      ensure_ascii=False
                  )

              print(message)
              raise SystemExit(0)

          # ------------------------------------------------------------
          # BISHER GESEHENE MELDUNGEN LADEN
          # ------------------------------------------------------------

          if os.path.exists(STATE):
              try:
                  with open(STATE, "r", encoding="utf-8") as f:
                      seen = set(json.load(f))
              except Exception:
                  seen = set()
          else:
              seen = set()

          candidates = []

          # ------------------------------------------------------------
          # STEAM
          # ------------------------------------------------------------

          try:
              root = ET.parse("aion2.xml").getroot()

              for item in root.findall(".//item"):
                  title = item.findtext("title", "").strip()
                  link = item.findtext("link", "").strip()
                  guid = item.findtext("guid", "").strip() or link

                  if not title or not link or not guid:
                      continue

                  if guid in seen:
                      continue

                  # Nur relevante AION-2-Meldungen
                  important_words = [
                      "update",
                      "patch",
                      "wartung",
                      "maintenance",
                      "server",
                      "event",
                      "ankündigung",
                      "announcement",
                      "roadmap",
                      "launch",
                      "hotfix",
                      "notice",
                      "belohn",
                      "reward",
                      "ausfall",
                      "compensation",
                      "entschädigung"
                  ]

                  title_lower = title.lower()

                  if not any(
                      word in title_lower
                      for word in important_words
                  ):
                      continue

                  candidates.append({
                      "source": "Steam",
                      "title": title,
                      "link": link,
                      "id": guid
                  })

          except Exception as e:
              print("Steam konnte nicht gelesen werden:", e)

          # ------------------------------------------------------------
          # OFFIZIELLE PLAYNC-SEITEN
          # ------------------------------------------------------------

          def read_nc(filename, language):
              try:
                  with open(
                      filename,
                      "r",
                      encoding="utf-8",
                      errors="ignore"
                  ) as f:
                      page = f.read()
              except Exception as e:
                  print(filename, "konnte nicht gelesen werden:", e)
                  return []

              ids = re.findall(
                  r'view\?articleId=([A-Za-z0-9_-]+)',
                  page,
                  re.I
              )

              ids += re.findall(
                  r'"articleId"\s*:\s*"([A-Za-z0-9_-]+)"',
                  page,
                  re.I
              )

              # Reihenfolge erhalten, Duplikate entfernen
              ids = list(dict.fromkeys(ids))

              results = []

              # Nur die ersten aktuellen Artikel betrachten.
              # Dadurch werden keine alten Meldungen massenhaft verschickt.
              for article_id in ids[:10]:

                  link = (
                      "https://aion2.plaync.com/"
                      f"{language}/board/notice/view?"
                      f"articleId={article_id}"
                  )

                  if link in seen:
                      continue

                  results.append({
                      "source": "NC",
                      "title": "Neue offizielle AION-2-Ankündigung",
                      "link": link,
                      "id": link
                  })

              return results

          nc_de = read_nc("nc-de.html", "de-de")
          nc_en = read_nc("nc-en.html", "en-us")

          # Deutsche Meldungen zuerst
          candidates.extend(nc_de)

          # Englische Meldungen nur ergänzen,
          # wenn sie nicht bereits dieselbe Meldung darstellen.
          de_ids = {item["id"] for item in nc_de}

          for item in nc_en:
              if item["id"] not in de_ids:
                  candidates.append(item)

          # ------------------------------------------------------------
          # NC NEWSROOM
          # ------------------------------------------------------------

          try:
              with open(
                  "newsroom.html",
                  "r",
                  encoding="utf-8",
                  errors="ignore"
              ) as f:
                  newsroom = f.read()

              articles = re.findall(
                  r'href=["\']([^"\']*articleId=[A-Za-z0-9_-]+[^"\']*)["\']'
                  r'[^>]*>(.*?)</a>',
                  newsroom,
                  re.I | re.S
              )

              for link, raw_title in articles:

                  title = re.sub(
                      r"<[^>]+>",
                      " ",
                      raw_title
                  )

                  title = re.sub(
                      r"\s+",
                      " ",
                      title
                  ).strip()

                  if "aion 2" not in title.lower():
                      continue

                  if link.startswith("/"):
                      link = "https://www.nc.com" + link

                  elif link.startswith("?"):
                      link = (
                          "https://www.nc.com/"
                          "newsroom/news/articles/"
                          + link
                      )

                  if link in seen:
                      continue

                  candidates.append({
                      "source": "NC Newsroom",
                      "title": title or "AION 2 – NC Newsroom",
                      "link": link,
                      "id": link
                  })

          except Exception as e:
              print("NC Newsroom konnte nicht gelesen werden:", e)

          # ------------------------------------------------------------
          # DOPPELTE MELDUNGEN ENTFERNEN
          # ------------------------------------------------------------

          unique = []
          known_ids = set()

          for item in candidates:
              if item["id"] in known_ids:
                  continue

              known_ids.add(item["id"])
              unique.append(item)

          candidates = unique

          # ------------------------------------------------------------
          # NUR DIE AKTUELLSTEN MELDUNGEN VERARBEITEN
          # ------------------------------------------------------------

          # Maximal drei Meldungen pro Durchlauf.
          # Wichtig: Nur tatsächlich versendete Meldungen
          # werden anschließend als gesehen gespeichert.
          messages = candidates[:3]

          # ------------------------------------------------------------
          # NICHTS NEUES
          # ------------------------------------------------------------

          if not messages:

              print("Keine neue relevante AION-2-Meldung.")

              with open(
                  PAYLOAD,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      {"content": ""},
                      f,
                      ensure_ascii=False
                  )

              with open(
                  STATE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      sorted(seen),
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              raise SystemExit(0)

          # ------------------------------------------------------------
          # DISCORD-NACHRICHT AUFBAUEN
          # ------------------------------------------------------------

          parts = [
              "📡 **Ätherstrom – AION 2**",
              ""
          ]

          for item in messages:
              parts.append(
                  f"📰 **{item['title']}**"
              )
              parts.append(
                  f"🔗 {item['link']}"
              )
              parts.append("")

          message = "\n".join(parts).strip()

          with open(
              PAYLOAD,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  {"content": message},
                  f,
                  ensure_ascii=False
              )

          # ------------------------------------------------------------
          # NUR GESENDETE MELDUNGEN ALS GESEHEN MARKIEREN
          # ------------------------------------------------------------

          for item in messages:
              seen.add(item["id"])

          with open(
              STATE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  sorted(seen),
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(message)

          PY

      - name: Meldung an Discord senden
        run: |
          if [ -f payload.json ]; then

            CONTENT=$(python3 - <<'PY'
          import json

          with open(
              "payload.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(data.get("content", ""))
          PY
          )

            if [ -n "$CONTENT" ]; then

              curl -X POST \
                -H "Content-Type: application/json" \
                --data-binary @payload.json \
                "${{ secrets.DISCORD_WEBHOOK_URL }}"

            fi
          fi

      - name: Gelesene Meldungen speichern
        run: |
          git config user.name "Atreias-WLAN"
          git config user.email "actions@github.com"

          git add aion2_seen.json

          if ! git diff --cached --quiet; then
            git commit -m "Atreias-WLAN: Meldungen aktualisieren"
            git push
          fi
