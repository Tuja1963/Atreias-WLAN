name: Atreias-WLAN

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

jobs:
  runa:
    runs-on: ubuntu-latest

    steps:
      - name: AION 2 Seite abrufen
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://aion2.plaync.com/en-us/board/notice/list?redirect=false" \
            -o aion2.html

      - name: AION 2 Meldung erkennen
        run: |
          python3 - <<'PY'
          import re
          import json
          from html import unescape

          with open("aion2.html", "r", encoding="utf-8") as f:
              html = f.read()

          pattern = r'articleId=([0-9a-f]+)'
          matches = re.findall(pattern, html, re.I)

          if matches:
              article_id = matches[0]

              link = (
                  "https://aion2.plaync.com/en-us/board/notice/view"
                  f"?articleId={article_id}"
              )

              message = (
                  "📡 **Ätherstrom – AION 2**\n\n"
                  "Eine neue bzw. aktuelle AION-2-Meldung wurde gefunden.\n\n"
                  f"🔗 {link}"
              )
          else:
              message = (
                  "📡 **Ätherstrom – AION 2**\n\n"
                  "Die AION-2-Seite wurde erreicht, "
                  "aber in der gelieferten Seite wurde noch keine "
                  "Artikel-ID gefunden."
              )

          payload = {
              "content": message
          }

          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

      - name: Nachricht an Discord senden
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
