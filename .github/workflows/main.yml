name: Atreias-WLAN

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

jobs:
  runa:
    runs-on: ubuntu-latest

    steps:
      - name: AION 2 Seite abrufen
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://aion2.plaync.com/en-us/board/notice/list" \
            -o aion2.html

      - name: Erste Meldung erkennen
        run: |
          python3 - <<'PY'
          import re
          import json
          from html import unescape

          with open("aion2.html", "r", encoding="utf-8") as f:
              html = f.read()

          match = re.search(
              r'href="([^"]*/board/notice/view\?articleId=([^"&]+)[^"]*)"[^>]*>(.*?)</a>',
              html,
              re.S
          )

          if match:
              link = unescape(match.group(1))
              article_id = match.group(2)

              title = re.sub(r"<[^>]+>", " ", match.group(3))
              title = re.sub(r"\s+", " ", title).strip()

              message = (
                  "📡 **AION 2 – Atreias-WLAN**\n\n"
                  f"**{title}**\n\n"
                  f"Artikel-ID: {article_id}\n"
                  f"{link}"
              )
          else:
              message = (
                  "📡 **AION 2 – Atreias-WLAN**\n\n"
                  "Keine AION-2-Meldung gefunden."
              )

          payload = {
              "content": message[:1800]
          }

          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

      - name: Nachricht an Discord senden
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
