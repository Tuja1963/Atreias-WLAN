name: Atreias-WLAN – NC Test

on:
  workflow_dispatch:

jobs:
  nc-test:
    runs-on: ubuntu-latest

    steps:
      - name: NC-Daten abrufen
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://aion2.plaync.com/en-us/board/notice/list?redirect=false" \
            -o nc.html

          echo "Antwort:"
          wc -c nc.html

      - name: Artikel-Links suchen
        run: |
          python3 - <<'PY'
          import re

          with open("nc.html", "r", encoding="utf-8", errors="ignore") as f:
              html = f.read()

          links = re.findall(
              r'https?://aion2\.plaync\.com[^"\'<>\s]+',
              html
          )

          links = list(dict.fromkeys(links))

          print(f"Gefundene AION-2-Links: {len(links)}")

          for link in links[:20]:
              print(link)
          PY
