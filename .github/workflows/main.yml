name: Atreias-WLAN – NC Antenne

on:
  workflow_dispatch:

jobs:
  nc-news:
    runs-on: ubuntu-latest

    steps:
      - name: Offizielle AION-2-Ankündigungen abrufen
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://aion2.plaync.com/en-us/board/notice/list?redirect=false" \
            -o nc.html

          echo "NC-Seite abgerufen."
          wc -c nc.html

      - name: AION-2-Meldungen auslesen
        run: |
          python3 - <<'PY'
          import re
          from html import unescape

          with open("nc.html", "r", encoding="utf-8", errors="ignore") as f:
              page = f.read()

          # Artikel-IDs aus der offiziellen AION-2-Seite suchen
          ids = re.findall(
              r'articleId[=/:"\']+([0-9]+)',
              page,
              re.I
          )

          ids = list(dict.fromkeys(ids))

          print(f"Gefundene Artikel-IDs: {len(ids)}")

          if not ids:
              print("Keine Artikel-ID gefunden.")
              raise SystemExit(1)

          for article_id in ids[:20]:
              print(
                  "https://aion2.plaync.com/en-us/board/notice/"
                  + article_id
              )

          print("NC-Antenne konnte die offiziellen Artikel erkennen.")
          PY
