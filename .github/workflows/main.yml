name: Atreias-WLAN – NC Artikel lesen

on:
  workflow_dispatch:

jobs:
  nc-article:
    runs-on: ubuntu-latest

    steps:
      - name: Offiziellen NC-AION-2-Artikel abrufen
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            "https://www.nc.com/newsroom/news/articles/?articleId=695dbbc84984ee2095a3cd1c&boardLanguage=en" \
            -o article.html

          echo "NC-Artikel geladen:"
          wc -c article.html

      - name: Titel des NC-Artikels finden
        run: |
          python3 - <<'PY'
          import re
          from html import unescape

          with open(
              "article.html",
              "r",
              encoding="utf-8",
              errors="ignore"
          ) as f:
              page = f.read()

          # Titel aus <title> holen
          match = re.search(
              r"<title[^>]*>(.*?)</title>",
              page,
              re.I | re.S
          )

          if match:
              title = re.sub(r"<[^>]+>", " ", match.group(1))
              title = unescape(title)
              title = re.sub(r"\s+", " ", title).strip()

              print("NC-Titel gefunden:")
              print(title)
          else:
              print("Kein Titel gefunden.")
              raise SystemExit(1)

          print()
          print("NC-Artikel:")
          print(
              "https://www.nc.com/newsroom/news/articles/"
              "?articleId=695dbbc84984ee2095a3cd1c"
              "&boardLanguage=en"
          )
          PY
