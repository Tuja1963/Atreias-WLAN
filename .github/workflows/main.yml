name: Atreias-WLAN

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

jobs:
  runa:
    runs-on: ubuntu-latest

    steps:
      - name: Discord-Verbindung testen
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{"content":"📡 Atreias-WLAN ist verbunden. Runa empfängt das Signal aus Atreia. 🌿"}' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
