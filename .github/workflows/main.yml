name: Atreias-WLAN

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Runa prüft die offizielle AION-2-Seite
        run: |
          echo "📡 Runa ist auf Empfang."
          echo "🔎 Ich schaue kurz, was es Neues aus Atreia gibt."

          curl -L --fail --silent --show-error \
            "https://aion2.ncsoft.jp/en/contents" \
            -o aion2.html

          echo "✅ Die offizielle AION-2-Seite wurde erreicht."
          echo "📄 Empfangene Daten:"
          wc -c aion2.html
